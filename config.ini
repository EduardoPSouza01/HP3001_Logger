[logger]
# Intervalo entre leituras, em segundos
interval_seconds = 60
# Nome do equipamento (gravado em cada registro, util na auditoria)
device_name = HP3001-01
# hid (padrao no Windows), usb (precisa de driver WinUSB) ou fake (simulado)
backend = hid
# Iniciar a coleta automaticamente ao abrir o painel (python app.py)
autostart = true

[web]
host = 127.0.0.1
port = 5000

# Nomes amigaveis dos canais (opcional)
[channels]
1 = Canal 1
2 = Canal 2
3 = Canal 3
4 = Canal 4
5 = Canal 5

[database]
# SQLite (funciona sem instalar nada):
url = sqlite:///hp3001.db
# SQL Server (precisa do "ODBC Driver 17/18 for SQL Server"):
# url = mssql+pyodbc://USUARIO:SENHA@SERVIDOR/BANCO?driver=ODBC+Driver+17+for+SQL+Server
# SQL Server com login do Windows:
# url = mssql+pyodbc://@SERVIDOR/BANCO?driver=ODBC+Driver+17+for+SQL+Server&trusted_connection=yes
